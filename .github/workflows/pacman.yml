
name: Generate Pacman

on:
  schedule:
    - cron: "15 */3 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: generate-pacman
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate pacman contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify generated files
        run: |
          ls -lh dist/
          test -s dist/pacman-contribution-graph.svg
          test -s dist/pacman-contribution-graph-dark.svg

      - name: Push pacman to output branch (attempt 1)
        id: push_pacman_attempt_1
        continue-on-error: true
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push pacman to output branch (attempt 2)
        if: ${{ steps.push_pacman_attempt_1.outcome == 'failure' }}
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
